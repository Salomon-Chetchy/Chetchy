name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
          else
            cat <<'EOF' | tr -d '[:space:]' | base64 -d > debug.keystore

EOF
          fi
          [ -f .env ] || [ -f .env.example ] || touch .env.example

      - name: Build Debug APK
        run: gradle assembleDebug -PciBuildNumber=${{ github.run_number }} --no-daemon --stacktrace

      - name: Prepare and verify APK metadata
        id: apk_info
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Chats-debug.apk
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)
          APKSIGNER_OUT=$("$BUILD_TOOLS_DIR/apksigner" verify --print-certs dist/Chats-debug.apk)
          echo "$APKSIGNER_OUT"
          CERT_SHA256=$(echo "$APKSIGNER_OUT" | grep -i 'SHA-256 digest' | grep -oE '[0-9a-fA-F]{64}' | head -n1 | tr '[:upper:]' '[:lower:]')
          BADGING=$("$BUILD_TOOLS_DIR/aapt2" dump badging dist/Chats-debug.apk | head -n1)
          VERSION_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          PACKAGE_NAME=$(echo "$BADGING" | sed -E "s/^package: name='([^']+)'.*/\1/")
          if [ -z "$CERT_SHA256" ] || [ -z "$VERSION_CODE" ] || [ -z "$PACKAGE_NAME" ]; then
            echo "Failed to verify APK signing certificate, package name, or versionCode" >&2
            exit 1
          fi
          EXPECTED_SHA256="d64b2673c8af271f6aa1050c8d6a865e179dfe2c8c0fcef9f505039bb05b09fb"
          if [ "$CERT_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: APK signing SHA-256 ($CERT_SHA256) does not match expected keystore ($EXPECTED_SHA256)" >&2
            exit 1
          fi
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME:-1.1}" >> "$GITHUB_OUTPUT"
          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chats-APK-v${{ steps.apk_info.outputs.version_name }}-b${{ github.run_number }}
          path: dist/Chats-debug.apk

      - name: Publish GitHub Release with direct APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk_info.outputs.version_name }}-b${{ github.run_number }}
          name: Chats v${{ steps.apk_info.outputs.version_name }} (Build ${{ github.run_number }})
          body: |
            Automated APK build for Chats (`versionCode = ${{ steps.apk_info.outputs.version_code }}`).
            - **Package:** `${{ steps.apk_info.outputs.package_name }}`
            - **Signing SHA-256:** `${{ steps.apk_info.outputs.cert_sha256 }}`
            Tap **Chats-debug.apk** below on your Android phone to download and install.
          files: dist/Chats-debug.apk
