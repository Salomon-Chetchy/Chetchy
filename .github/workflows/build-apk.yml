name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          [ -f .env ] || [ -f .env.example ] || touch .env.example

      - name: Build Debug APK
        run: gradle assembleDebug -PciBuildNumber=${{ github.run_number }} --no-daemon --stacktrace

      - name: Prepare APK filename
        id: apk_info
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Chats-debug.apk
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n1 | grep -oE '[0-9]+')
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version_code=${VERSION_CODE:-1}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME:-1.0}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chats-APK-v${{ steps.apk_info.outputs.version_name }}-b${{ github.run_number }}
          path: dist/Chats-debug.apk

      - name: Publish GitHub Release with direct APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk_info.outputs.version_name }}-b${{ github.run_number }}
          name: Chats v${{ steps.apk_info.outputs.version_name }} (Build ${{ github.run_number }})
          body: |
            Automated APK build for Chats (`versionCode = ${{ steps.apk_info.outputs.version_code }}`).
            Tap **Chats-debug.apk** below on your Android phone to download and install.
          files: dist/Chats-debug.apk
